<!doctype html>
<!-- Self-made sample page for the screenshot smoke test (see SOURCES.md). No text, so no font differences. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shapes fixture</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1b1b1f;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" width="640" height="360"></canvas>
    <script>
      const ctx = document.getElementById("scene").getContext("2d");
      const cell = 40;
      ctx.strokeStyle = "#3a3a44";
      for (let x = 0; x <= 640; x += cell) {
        ctx.beginPath();
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, 360);
        ctx.stroke();
      }
      for (let y = 0; y <= 360; y += cell) {
        ctx.beginPath();
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(640, y + 0.5);
        ctx.stroke();
      }
      ctx.fillStyle = "#c0392b";
      ctx.fillRect(2 * cell, 2 * cell, cell, cell);
      ctx.fillStyle = "#2e86c1";
      ctx.beginPath();
      ctx.arc(8.5 * cell, 4.5 * cell, cell / 2 - 4, 0, Math.PI * 2);
      ctx.fill();
    </script>
  </body>
</html>

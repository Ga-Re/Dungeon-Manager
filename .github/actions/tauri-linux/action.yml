# System libraries Tauri needs to compile and run on Ubuntu (WebKitGTK and friends).
name: Tauri Linux dependencies
description: Install the apt packages for building (and optionally driving) the Tauri desktop app.
inputs:
  webdriver:
    description: Also install WebKitWebDriver and Xvfb for tauri-driver smoke tests.
    default: "false"
runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      env:
        WEBDRIVER: ${{ inputs.webdriver }}
      run: |
        packages="libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev build-essential pkg-config"
        if [ "$WEBDRIVER" = "true" ]; then packages="$packages webkit2gtk-driver xvfb"; fi
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends $packages

# Shared job setup: pinned Node + pnpm, cached pnpm store, frozen install.
# Only official actions/* are used, pinned by commit SHA (public repo, supply-chain safety).
name: Setup workspace
description: Install Node (from .nvmrc), pnpm (from packageManager) and the workspace dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc

    # Node 26 no longer bundles Corepack, so install the exact `packageManager` version.
    - name: Install pnpm
      shell: bash
      run: npm install --global "$(node -p "require('./package.json').packageManager")"

    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

# `@claude` in a pull request comment or review lets Claude Code address the feedback (T-005).
#
# Public repository, so access is locked down in three layers:
#  1. Only the repository owner can trigger it: the job `if` checks the comment author.
#  2. Only pull requests from branches of this repository: the `gate` job (no secrets)
#     rejects fork PRs, so fork code never runs next to the API key.
#  3. Claude only sees the owner's comments (`include_comments_by_actor`), so text from
#     other users cannot inject instructions.
# The action itself additionally requires write access to the repository.
# Note: review events on same-repo PRs use this file from the PR branch, so changes to it
# take effect there before merge; only people with write access can push branches.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  gate:
    name: claude-gate
    # Owner only, PR conversations only, and only when the text mentions @claude.
    if: >-
      github.event.sender.login == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.author_association == 'OWNER' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
          github.event.comment.author_association == 'OWNER' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          github.event.review.author_association == 'OWNER' &&
          contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      same-repo: ${{ steps.head.outputs.same-repo }}
    steps:
      - name: Reject pull requests from forks
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          head_repo="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.repo.full_name')"
          if [ "$head_repo" = "$REPO" ]; then
            echo "same-repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "same-repo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pull request comes from '$head_repo' (fork) – Claude does not run on forks."
          fi

  claude:
    name: claude
    needs: gate
    if: needs.gate.outputs.same-repo == 'true'
    # Job-level, so only runs that passed the gate compete: one Claude run per PR at a
    # time; a newer @claude request waits (and replaces an older one that is still waiting).
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The action authenticates git with the Claude app token itself; pushes made with
          # the workflow token would not trigger CI.
          persist-credentials: false
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          include_comments_by_actor: ${{ github.repository_owner }}
          additional_permissions: |
            actions: read

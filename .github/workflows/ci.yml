# Quality gates from ADR-0009. Job names are the required status checks (see README).
name: CI

on:
  # `pull_request` (never `pull_request_target`): fork PRs run without secrets and
  # with a read-only token.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck, lint, format, boundaries, unit tests with coverage
        run: pnpm check

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report/e2e
            test-results/e2e
          retention-days: 7

  visual:
    name: visual
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Screenshot tests (pinned Playwright Docker image)
        run: pnpm test:visual
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: |
            playwright-report/visual
            test-results/visual
          retention-days: 7

  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MANIFEST: apps/desktop/src-tauri/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust crate arrives with T-006; until then this job passes so it can already
      # be a required check. rustup reads the toolchain from rust-toolchain.toml.
      - name: Skip when there is no crate yet
        if: hashFiles('apps/desktop/src-tauri/Cargo.toml') == ''
        run: echo "No Rust crate yet (apps/desktop/src-tauri) – nothing to check."
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: hashFiles('apps/desktop/src-tauri/Cargo.toml') != ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: rustfmt
        if: hashFiles('apps/desktop/src-tauri/Cargo.toml') != ''
        run: cargo fmt --manifest-path "$MANIFEST" --check
      - name: clippy
        if: hashFiles('apps/desktop/src-tauri/Cargo.toml') != ''
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings
      - name: test
        if: hashFiles('apps/desktop/src-tauri/Cargo.toml') != ''
        run: cargo test --manifest-path "$MANIFEST"
